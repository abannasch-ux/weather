<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Andy's Weather</title>
<meta name="description" content="Andy's personal weather: places, charts, radar, rain/snow timing, UV and air quality.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { color-scheme: dark; --tab-h: 62px; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0d1b2a; color: #eef4f8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100dvh;
  }
  main { padding: calc(env(safe-area-inset-top) + 14px) 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px); max-width: 640px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  .sub { color: #9db4c4; font-size: 14px; margin-bottom: 14px; }
  /* search */
  #search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  #search-input {
    flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px; color: #eef4f8; font-size: 17px; padding: 11px 14px; outline: none; min-width: 0;
  }
  #edit-btn {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); color: #eef4f8;
    border-radius: 12px; font-size: 15px; font-weight: 600; padding: 0 16px; cursor: pointer;
  }
  #search-results { display: none; margin-bottom: 12px; }
  .search-item {
    width: 100%; text-align: left; background: rgba(255,255,255,.05); color: #eef4f8;
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 11px 14px;
    font-size: 16px; margin-bottom: 6px; cursor: pointer;
  }
  .search-item span { color: #9db4c4; font-size: 13px; display: block; }
  /* cards */
  .card {
    position: relative; display: block; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.11);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; width: 100%;
    text-align: left; color: #eef4f8; font: inherit;
  }
  .card .name { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card .alert-dot { color: #ffb02e; font-size: 17px; }
  .card .now-row { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
  .card .temp { font-size: 40px; font-weight: 800; line-height: 1.05; }
  .card .cond { color: #c7d6e0; font-size: 16px; }
  .card .meta { color: #9db4c4; font-size: 14.5px; margin-top: 5px; line-height: 1.45; display: block; }
  .card .meta b { color: #dcebf5; font-weight: 600; }
  .card .del {
    display: none; position: absolute; top: 10px; right: 10px; width: 32px; height: 32px;
    border-radius: 50%; border: none; background: #c0392b; color: #fff; font-size: 17px; cursor: pointer; z-index: 2;
  }
  body.editing .card .del { display: block; }
  .gps-card { border-color: rgba(76,195,255,.45); }
  /* detail */
  #back-btn {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18); color: #eef4f8;
    border-radius: 999px; font-size: 15.5px; font-weight: 600; padding: 8px 18px; cursor: pointer; margin-bottom: 12px;
  }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .chip {
    flex: 0 0 auto; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); color: #c7d6e0;
    border-radius: 999px; padding: 8px 15px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .chip.active { background: rgba(76,195,255,.2); border-color: #4cc3ff; color: #eef4f8; }
  .hero { display: flex; align-items: center; gap: 8px; }
  .big-temp { font-size: 72px; font-weight: 800; line-height: 1; }
  .hero-side { margin-left: auto; text-align: right; }
  .cond-line { font-size: 19px; color: #c7d6e0; margin-top: 6px; }
  .kv { color: #9db4c4; font-size: 15.5px; margin-top: 8px; line-height: 1.5; }
  .kv b { color: #eef4f8; font-weight: 600; }
  .verdict {
    background: rgba(76,195,255,.12); border: 1px solid rgba(76,195,255,.35);
    border-radius: 14px; padding: 13px 15px; font-size: 18.5px; line-height: 1.4; margin: 14px 0 6px;
  }
  .verdict b { color: #aee2ff; }
  .section-title { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #9db4c4; margin: 22px 0 8px; }
  .chart-box { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; padding: 10px 8px 4px; margin-bottom: 10px; }
  .chart-box svg { width: 100%; height: auto; display: block; }
  .chart-cap { font-size: 13px; color: #9db4c4; padding: 4px 6px 6px; }
  .chart-cap b { color: #dcebf5; }
  .window-row {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 7px; font-size: 16.5px; line-height: 1.4;
  }
  .day-row {
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.045); width: 100%;
    border: 1px solid rgba(255,255,255,.09); border-radius: 12px; padding: 10px 13px; margin-bottom: 7px;
    font-size: 15.5px; color: #eef4f8; font: inherit; text-align: left; cursor: pointer;
  }
  .day-row.active { border-color: #4cc3ff; background: rgba(76,195,255,.1); }
  .day-row .d { width: 48px; font-weight: 700; }
  .day-row .e { font-size: 20px; }
  .day-row .hl { margin-left: auto; text-align: right; }
  .day-row .pp { color: #7ec8f7; font-size: 13.5px; display: block; }
  .alert {
    border-radius: 12px; padding: 11px 14px; margin: 10px 0 0; font-size: 15px; line-height: 1.4;
    background: rgba(255,176,46,.13); border: 1px solid rgba(255,176,46,.55);
  }
  .alert.severe { background: rgba(224,49,49,.15); border-color: rgba(224,49,49,.65); }
  .alert b { display: block; font-size: 16px; }
  .alert span { color: #d8c9a8; font-size: 13.5px; }
  .alert.severe span { color: #eec5c5; }
  /* gauges / bottom info */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-box { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; padding: 12px 14px; }
  .info-box .lab { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #9db4c4; font-weight: 700; }
  .info-box .val { font-size: 30px; font-weight: 800; margin-top: 2px; }
  .info-box .desc { font-size: 14px; color: #c7d6e0; margin-top: 2px; line-height: 1.4; }
  .gauge { height: 8px; border-radius: 4px; margin-top: 9px; background: linear-gradient(90deg, #3ecf5a, #ffe14d, #ff8a3d, #e03131, #8e44ad); position: relative; }
  .gauge.aqi { background: linear-gradient(90deg, #3ecf5a, #ffe14d, #ff8a3d, #e03131, #7d3c98, #641e16); }
  .gauge .pin { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.7); }
  .pollen-link {
    display: block; margin-top: 10px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.09);
    border-radius: 14px; padding: 13px 14px; color: #aee2ff; font-size: 16px; font-weight: 600; text-decoration: none;
  }
  .pollen-link span { display: block; color: #9db4c4; font-size: 13.5px; font-weight: 400; margin-top: 2px; }
  #status-line { color: #7e97a8; font-size: 13.5px; margin-top: 14px; }
  /* animated condition scene */
  .scene { position: relative; width: 96px; height: 96px; flex: 0 0 auto; overflow: visible; }
  .scene .drop { position: absolute; top: -12px; width: 3px; height: 15px; border-radius: 2px; background: #7ec8f7; opacity: 0; animation: fall 1.1s linear infinite; }
  @keyframes fall { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .95; } 90% { opacity: .95; } 100% { transform: translateY(104px); opacity: 0; } }
  .scene .flake { position: absolute; top: -8px; color: #eef6fb; opacity: 0; animation: snow 3.4s linear infinite; }
  @keyframes snow { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: 1; } 50% { transform: translate(-7px, 52px); } 100% { transform: translate(5px, 106px); opacity: .2; } }
  .scene .sun-core { position: absolute; left: 22px; top: 22px; width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #ffe9a8, #ffb02e); box-shadow: 0 0 26px rgba(255,176,46,.55); }
  .scene .rays { position: absolute; left: 8px; top: 8px; width: 80px; height: 80px; animation: spin 26s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scene .cloudblob { position: absolute; background: #c7d6e0; border-radius: 999px; opacity: .9; animation: drift 5s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-4px); } to { transform: translateX(5px); } }
  .scene .mist { position: absolute; left: 4px; right: 4px; height: 9px; border-radius: 5px; background: rgba(199,214,224,.4); animation: mist 4.5s ease-in-out infinite alternate; }
  @keyframes mist { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  .scene .flash { position: absolute; inset: 0; background: #fff8d6; opacity: 0; animation: flash 4.2s linear infinite; border-radius: 14px; }
  @keyframes flash { 0%, 88%, 92%, 100% { opacity: 0; } 90% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
  /* radar */
  #view-radar { margin: calc(-1 * (env(safe-area-inset-top) + 14px)) -16px 0; }
  #map { height: calc(100dvh - var(--tab-h) - env(safe-area-inset-bottom) - 52px); min-height: 320px; background: #0a141f; }
  #radar-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 2px 0; }
  #radar-scrub { flex: 1 1 100%; order: 3; accent-color: #4cc3ff; height: 30px; margin: 0; }
  #radar-controls button {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); color: #eef4f8;
    border-radius: 999px; font-size: 15px; font-weight: 600; padding: 8px 18px; cursor: pointer;
  }
  #radar-time { color: #9db4c4; font-size: 14.5px; margin-left: auto; }
  .maplibregl-container { font: inherit; }
  .you-dot {
    width: 15px; height: 15px; border-radius: 50%;
    background: #4cc3ff; border: 3px solid #fff; box-shadow: 0 0 7px rgba(0,0,0,.55);
  }
  /* tab bar */
  #tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(10, 22, 34, .92); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,.13);
    display: flex;
  }
  #tabbar button {
    flex: 1; background: none; border: none; color: #8fa9bb; cursor: pointer;
    font-size: 12.5px; font-weight: 600; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; padding-top: 6px;
  }
  #tabbar button .ic { font-size: 22px; line-height: 1; }
  #tabbar button.active { color: #7ec8f7; }
</style>
</head>
<body>
<main>
  <!-- PLACES -->
  <section id="view-places" class="view">
    <h1>Places</h1>
    <div class="sub">Tap a place for charts, day-by-day detail, UV and air quality.</div>
    <div id="search-row">
      <input id="search-input" type="text" placeholder="Add a place — try a city name" autocomplete="off">
      <button id="edit-btn" type="button">Edit</button>
    </div>
    <div id="search-results"></div>
    <div id="gps-slot"></div>
    <div id="places-list"></div>
    <div id="places-status" class="sub"></div>
  </section>

  <!-- RADAR -->
  <section id="view-radar" class="view">
    <div id="map"></div>
    <div id="radar-controls">
      <button id="radar-play" type="button">Pause</button>
      <button id="radar-center" type="button">Center on me</button>
      <input id="radar-scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Radar time scrubber">
      <span id="radar-time">Loading radar…</span>
    </div>
  </section>

  <!-- DETAIL -->
  <section id="view-detail" class="view">
    <button id="back-btn" type="button">← All places</button>
    <div id="detail-body"></div>
  </section>
</main>

<nav id="tabbar">
  <button id="tab-places" type="button"><span class="ic">📍</span>Places</button>
  <button id="tab-radar" type="button"><span class="ic">🌧️</span>Radar</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
